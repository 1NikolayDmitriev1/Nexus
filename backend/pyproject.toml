[project]
name = "backend"
version = "0.1.0"
description = "Nexus Autonomous AI Research Workspace Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "duckduckgo-search>=8.0.0",
  "fastapi>=0.115.0",
  "google-genai>=3.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.30.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

