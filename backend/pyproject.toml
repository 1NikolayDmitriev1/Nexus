[project]
name = "backend"
version = "0.1.0"
description = "Nexus Autonomous AI Research Workspace Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "ddgs>=9.0.0",
  "fastapi>=0.115.0",
  "google-genai>=3.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.36",
  "asyncpg>=0.30.0",
  "pgvector>=0.3.0",
  "alembic>=1.14.0",
  "greenlet>=3.1.1",
  "redis>=5.2.0",
  "argon2-cffi>=23.1.0",
  "pyjwt>=2.10.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88

[tool.pyright]
venvPath = "."
venv = ".venv"

